# The Python lint, format and type-checking settings every ProductForge
# repository shares. `make update-config` rewrites these exact keys into a
# repository's own pyproject.toml ([tool.black], [tool.isort], and [tool.mypy]
# where it takes django-mypy) and setup.cfg ([flake8]), leaving every other key
# there — a repository's own excluded paths among them — untouched.

[python]
# The Python every ProductForge repository runs, stated here once. `update` derives black's
# `target-version` (py314), mypy's `python_version` (3.14) and `requires-python`
# (>=3.14,<4.0) from it, and actions/setup installs it. The `pyupgrade` hook's `--py314-plus`
# in .pre-commit-hooks.yaml follows it: a test fails until that argument does.
version = "3.14"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
docstring-convention = "google"
extend-ignore = "D100,D101,D102,D103,D104,D105,D106,D107,D200,D202,D205,D212,D415,E203,W503"

# The type-checking strictness every Django API takes, written into
# [tool.mypy] wherever the repository takes the django-mypy hook. What is the
# project's own — mypy_path, plugins, overrides — stays in its pyproject.toml.
[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_any_explicit = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
