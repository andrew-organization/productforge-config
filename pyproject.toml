[project]
name = "productforge-config"
dynamic = ["version"]
description = "ProductForge — the update command that brings a repository up to a productforge-config release"
requires-python = ">=3.14,<4.0"
dependencies = []

[project.scripts]
productforge-config = "productforge_config.cli:main"
productforge-final-newline = "productforge_config.final_newline:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6",
  "pre-commit-hooks==6.0.0",
  "pytest>=9.1",
  "pytest-xdist>=3.8.0",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is the release's git tag, which semantic-release creates on
# every releasing merge to main; a checkout with no tag builds as 0.0.0.
[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/productforge_config"]

# The settings/ and kits/ this repository publishes
# are bundled into the wheel so the update command — installed fresh with
# uvx from a tag — reads exactly what that tag published, with no network
# call of its own. See src/productforge_config/cli.py.
[tool.hatch.build.targets.wheel.force-include]
"settings" = "productforge_config/settings"
"kits" = "productforge_config/kits"

[tool.uv]
package = true
# The package bundles settings/ and kits/, so an edit to them, or to the source, rebuilds the
# non-editable install `make test` runs against (uv's default watches pyproject.toml alone).
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.py" },
  { file = "kits/**/*" },
  { file = "settings/*" },
]

# Settings for this repository's own Python (src/, tests/), matching what
# it publishes in settings/python.toml, on the same Python 3.14.

[tool.black]
target-version = ["py314"]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
tmp_path_retention_policy = "none"
