# This repository publishes these hooks (see .pre-commit-hooks.yaml) for
# every other ProductForge repository, so it runs them directly, at the
# same versions, rather than referencing its own not-yet-released self.
# tests/fixture_repo is the update command's test input, not this
# repository's own files.
exclude: ^tests/fixture_repo/
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py314-plus"]

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings>=1.7, pydocstyle>=6.3]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]

  # The end-of-file-fixer this repository publishes, run from its own
  # checkout: every text file ends in a newline, fixed and staged inside a
  # commit, failing in CI. See src/productforge_config/final_newline.py.
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: fix end of files
        entry: productforge-final-newline
        language: system
        types: [text]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        args: [--no-schema]

  - repo: https://github.com/checkmake/checkmake
    rev: v0.3.2
    hooks:
      - id: checkmake
