name: CI

on:
  # Every pull request, whatever it targets, so a PR stacked on another
  # gets the same checks as one targeting main.
  pull_request:
  # And every merge to main: the caches that run saves belong to main's scope,
  # which every pull request restores.
  push:
    branches:
      - main

# A new push to a pull request cancels the run it supersedes. A run on main is
# never cancelled, since a cancelled run saves no cache.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job, set up once, then every check in parallel on the same runner —
  # the same shape as every repository that takes this one's release. The
  # setup step here is this repository's own action, run against this
  # repository's own checkout: the same dogfooding that proves it works for
  # everyone else.
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./actions/setup
        with:
          token: ${{ secrets.PF_READ_TOKEN }}

      # The token reaches Git through the job's environment alone: no Git configuration file holds it.
      - name: Token is held only by the environment
        env:
          PF_TOKEN: ${{ secrets.PF_READ_TOKEN }}
        run: .github/scripts/check_token_scope.sh

      - parallel:
          - name: Lint
            run: make lint

          - name: Test
            run: make test

          # The files this repository's own update writes, unchanged since the release in .productforge/release.
          - name: Config unchanged
            run: make check-config

  # The credential step on a placeholder, so the proof that no Git configuration file holds a token runs on
  # every pull request, with or without the real secret.
  token-scope:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate Git reads with a placeholder token
        env:
          PF_TOKEN: placeholder-not-a-token-0123456789
        run: actions/setup/git_credential.sh

      - name: Token is held only by the environment
        env:
          PF_TOKEN: placeholder-not-a-token-0123456789
        run: .github/scripts/check_token_scope.sh

      - name: The placeholder is masked in the log
        env:
          PF_TOKEN: placeholder-not-a-token-0123456789
        run: echo "value=${PF_TOKEN}"
