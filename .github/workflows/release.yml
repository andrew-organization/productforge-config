name: Release

# The release every ProductForge repository shares. A repository calls it
# from its own release workflow, on a push to main:
#
#   jobs:
#     release:
#       uses: andrew-organization/productforge-config/.github/workflows/release.yml@vX.Y.Z
#       permissions: {contents: write, issues: write, pull-requests: write}
#       secrets:
#         PF_READ_TOKEN: ${{ secrets.PF_READ_TOKEN }}
#
# and this repository runs it on its own pushes to main. The squashed
# commit's subject is the pull request title, and its Conventional Commits
# type decides the next version: feat a minor, fix, perf, refactor and
# build(deps) a patch, a "!" or BREAKING CHANGE footer a major, anything else
# nothing. A release is a git tag and its GitHub release; a repository that
# also carries its version in a file writes and commits it through
# prepare-cmd, before the tag is made.
#
# PF_READ_TOKEN is the organisation's read token for productforge-config, which the job reads to
# add the closing "To take this release" section to the release's notes (see the steps below). A
# caller passes it by name, never with `secrets: inherit`, and this repository's own run needs none.
#
# A repository whose main requires a pull request can't let this job's own
# token push that version commit: GitHub refuses github-actions[bot] as a
# bypass actor. It may instead pass a write deploy key of its own, which its
# ruleset names as a bypass actor (productforge-config github apply
# --variant publishes --bypass-deploy-keys), held as a secret of an
# environment only main can use:
#
#       with: {environment: release}
#       secrets:
#         PF_READ_TOKEN: ${{ secrets.PF_READ_TOKEN }}
#         PF_RELEASE_DEPLOY_KEY: ${{ secrets.PF_RELEASE_DEPLOY_KEY }}
#
# The job then declares that environment and checks out over SSH with the
# key, so every push of the release, the version commit and the tag, goes
# over SSH. A caller passing neither releases with its token, as before.
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      prepare-cmd:
        description: >-
          Run after the next version is known and before it's tagged, with
          semantic-release's ${nextRelease.version} available — for a
          repository whose own files carry the version. Empty by default.
        type: string
        default: ""
      check-cmd:
        description: >-
          Run after the release, as a further check a repository adds of its
          own (for instance that a file's version matches the new tag).
          Empty by default.
        type: string
        default: ""
      environment:
        description: >-
          The environment the job runs in, for a repository whose deploy key
          is a secret of that environment. Empty by default: no environment.
        type: string
        default: ""
    secrets:
      PF_READ_TOKEN:
        description: >-
          The organisation's read-only token for productforge-config, which the job reads to add
          the closing section to the release's notes. Declared optional so that a caller without it
          is refused by the job's first step, naming this secret, rather than at startup; only a
          run of this repository's own release needs none.
        required: false
      PF_RELEASE_DEPLOY_KEY:
        description: >-
          A write deploy key of the calling repository, as its private half.
          When present the checkout uses it, so the release pushes over SSH.
          Absent by default: the job pushes with its token.
        required: false

jobs:
  release:
    runs-on: ${{ fromJSON(vars.PF_RUNS_ON || '"ubuntu-latest"') }}

    # Serialises overlapping runs rather than letting them race: two pull
    # requests merging close together would otherwise compute a next
    # version against the same branch at once.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false

    # A commit this job wrote (a repository's own version commit, through
    # prepare-cmd) must not start another release. Its "chore(release):"
    # type releases nothing, and "[skip ci]" in its subject runs no workflow
    # at all; this condition is the third guard.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    # Declared only when the caller gives one: an empty value is no
    # environment, so a repository without one is unaffected.
    environment: ${{ inputs.environment || null }}

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      # A private productforge-config can't be read with the job's own token, so a caller that is
      # not productforge-config itself must pass the read token; refused here, before anything is
      # released, so a missing token never leaves a release without its closing section.
      - name: Check the read token is given
        env:
          PF_TOKEN: ${{ secrets.PF_READ_TOKEN }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CONFIG_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          [ -n "${PF_TOKEN}" ] || [ "${CALLER_REPOSITORY}" = "${CONFIG_REPOSITORY}" ] || {
            echo "::error::the release reads ${CONFIG_REPOSITORY} to write the release's notes:" \
              "pass the organisation secret PF_READ_TOKEN to this workflow."
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Empty unless the caller passes a deploy key; then the checkout's
          # remote is SSH and the prepare step's push goes with that key.
          ssh-key: ${{ secrets.PF_RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22

      - name: Install semantic-release
        run: >-
          npm install --no-save
          semantic-release@24 @semantic-release/exec@7 conventional-changelog-conventionalcommits@8

      # The configuration lives here rather than in each repository, so every
      # repository releases by the same rules. It's written into the checkout
      # but excluded from git, so it never shows as a change.
      - name: Write the release configuration
        env:
          PREPARE_CMD: ${{ inputs.prepare-cmd }}
        run: |
          python3 - <<'PY'
          import json, os
          plugins = [
              ["@semantic-release/commit-analyzer", {
                  "preset": "conventionalcommits",
                  "releaseRules": [
                      {"type": "refactor", "release": "patch"},
                      {"type": "build", "scope": "deps", "release": "patch"},
                  ],
              }],
              ["@semantic-release/release-notes-generator", {"preset": "conventionalcommits"}],
          ]
          if os.environ["PREPARE_CMD"]:
              plugins.append(["@semantic-release/exec", {"prepareCmd": os.environ["PREPARE_CMD"]}])
          plugins.append(["@semantic-release/github", {
              "successComment": False, "failComment": False, "labels": False, "releasedLabels": False,
          }])
          with open(".releaserc.json", "w") as f:
              json.dump({"branches": ["main"], "plugins": plugins}, f, indent=2)
          PY
          echo ".releaserc.json" >> .git/info/exclude

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A run released when the newest stable tag sits on the commit the run is at, which a
      # prepare-cmd's version commit then is too. The newest tag changing across the release step
      # would not tell, since a re-run of a job that failed after releasing sees the same tag
      # before and after; this way the re-run still adds the closing section.
      - name: Find whether this run released
        id: released
        run: |
          git fetch --quiet --tags origin
          tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-' | head -n 1 || true)"
          releasing=false
          previous=""
          if [ -n "${tag}" ] && [ "$(git rev-list -n 1 "${tag}")" = "$(git rev-parse HEAD)" ]; then
            releasing=true
            previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' \
              "${tag}^" 2>/dev/null || true)"
          fi
          {
            echo "tag=${tag}"
            echo "releasing=${releasing}"
            echo "previous=${previous}"
          } >> "${GITHUB_OUTPUT}"

      # The code that finds the steps sections, read from this repository at the commit the
      # workflow runs from, untracked in the caller's checkout.
      - name: Read productforge-config
        if: ${{ steps.released.outputs.releasing == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .productforge-config
          token: ${{ secrets.PF_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Keep the checkout of productforge-config out of the caller's status
        if: ${{ steps.released.outputs.releasing == 'true' }}
        run: echo ".productforge-config" >> .git/info/exclude

      - name: Add the closing section to the release's notes
        if: ${{ steps.released.outputs.releasing == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS: ${{ steps.released.outputs.previous }}
          TAG: ${{ steps.released.outputs.tag }}
        run: >-
          python3 -I .productforge-config/src/productforge_config/release_notes.py
          --previous "${PREVIOUS}" --tag "${TAG}"

      # semantic-release exits successfully when it finds nothing to
      # release, including when a failed run left a tag behind without its
      # GitHub release. This turns that silent success into a failure.
      - name: Check the release is complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --quiet --tags origin "${GITHUB_REF_NAME}"
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' \
            "origin/${GITHUB_REF_NAME}" 2>/dev/null || true)"
          if [ -z "${latest}" ]; then
            echo "no release tag on ${GITHUB_REF_NAME} yet"
            exit 0
          fi
          gh release view "${latest}" > /dev/null || {
            echo "::error::no GitHub release exists for ${latest}"
            exit 1
          }

      - name: Run the repository's own check
        if: ${{ inputs.check-cmd != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ inputs.check-cmd }}
