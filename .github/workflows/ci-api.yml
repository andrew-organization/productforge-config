name: CI (API)

# The checks every ProductForge API repository runs on a pull request. A
# repository calls it from its own ci.yml, which `productforge-config init`
# writes:
#
#   jobs:
#     ci:
#       uses: andrew-organization/productforge-config/.github/workflows/ci-api.yml@vX.Y.Z
#       permissions: {contents: read}
#
# It runs the make targets a developer runs (make and Docker Compose read the
# repository's own productforge.env), so a failure here reproduces locally with
# the same command. A reusable workflow can't reference an action of this
# repository at its own tag, so its setup steps are written out here and mirror
# actions/setup/action.yml: a change to either goes in both.
on:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          prune-cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-${{ hashFiles('.productforge/pre-commit.yaml',
            '.pre-commit-config.yaml', '.pre-commit-lint.yaml') }}

      - name: Install dependencies
        run: make install

      # Parallel steps run inside a reusable workflow just as in a caller's own job.
      - parallel:
          - name: Lint
            run: make lint

          - name: Missing migrations
            run: make check-migrations

          - name: Unit tests
            run: make test

          # Starts its own Postgres from the kit's compose.test.yml, on this slot's test port.
          - name: Integration tests
            run: make test-integration-ci
