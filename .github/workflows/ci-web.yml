name: CI (web)

# The checks every ProductForge web repository runs on a pull request. A
# repository calls it from its own ci.yml, which `productforge-config init`
# writes:
#
#   jobs:
#     ci:
#       uses: andrew-organization/productforge-config/.github/workflows/ci-web.yml@vX.Y.Z
#       permissions: {contents: read}
#
# It runs the make targets a developer runs (make and Docker Compose read the
# repository's own productforge.env), so a failure here reproduces locally with
# the same command. A reusable workflow can't reference an action of this
# repository at its own tag with `uses:`, so it checks this repository out at the
# commit it runs from (`job.workflow_sha`) and calls actions/setup from there: the
# setup is written once, in that action.
on:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository at the commit this workflow runs from, untracked in the caller's checkout so
      # pre-commit never lints it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .productforge-config
          persist-credentials: false

      # The Flutter version the repository's own .fvmrc pins.
      - uses: ./.productforge-config/actions/setup
        with:
          flutter: "true"

      # Regenerates code and compares it, so it runs before anything that
      # reads the generated files.
      - name: Check generated code is up to date
        run: make check-generated

      # Mutates product.yaml and the identity files it regenerates, then
      # restores them: it runs on its own, not inside the parallel block below,
      # so nothing else reads those files mid-check.
      - name: Check identity regenerates from product.yaml
        run: make check-identity-regeneration

      - parallel:
          - name: Lint
            run: make lint

          - name: Unit tests
            run: make test

          # The files productforge-config writes, unchanged since the release recorded in .productforge/release.
          - name: Config unchanged
            run: make check-config
