name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: andrew-organization/productforge-config/actions/setup@v0.9.0
        with:
          postgres: "true"

      - parallel:
          - name: Lint
            run: make lint

          - name: Its own check
            run: make fixture-own-check
