exclude: '(^|/)migrations/|^\.git/'
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/andrew-organization/productforge-config
    rev: v0.9.0
    hooks:
      - id: pyupgrade
      - id: isort
      - id: black
      - id: flake8
      - id: django-mypy
      - id: trailing-whitespace
        types: [text]
      - id: end-of-file-fixer
        types: [text]
      - id: markdownlint
        args: [--fix]
      - id: yamllint
      - id: checkmake
