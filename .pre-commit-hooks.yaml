# The lint hooks every ProductForge repository shares, each pinned to its
# tool's own version so a consuming repository lists one hook source at one
# tag instead of several. A repository's own hooks (its extra checks, its
# ignored and excluded paths) stay in its own copy — see settings/ for the
# shared lint and format settings that go with these.
#
# additional_dependencies given here are the ones every consumer needs
# (flake8's docstring plugins); a consumer can still add its own on top
# where a hook is referenced, exactly as with any other pre-commit hook
# source.

- id: trailing-whitespace
  name: trailing whitespace
  description: Trims trailing whitespace.
  entry: trailing-whitespace-fixer
  language: python
  additional_dependencies: ["pre-commit-hooks==6.0.0"]
  types: [text]

# Inside a commit it stages its own fix and lets the commit through; in CI, or
# run by hand, it fails as any fixer does. See src/productforge_config/final_newline.py.
- id: end-of-file-fixer
  name: fix end of files
  description: Ensures every text file ends in a single newline, staging the fix inside a commit.
  entry: productforge-final-newline
  language: python
  additional_dependencies: ["pre-commit-hooks==6.0.0"]
  types: [text]

- id: markdownlint
  name: markdownlint
  description: Lints and auto-fixes Markdown.
  entry: markdownlint-cli2
  language: node
  additional_dependencies: ["markdownlint-cli2@0.22.1"]
  types: [markdown]

- id: pyupgrade
  name: pyupgrade
  description: Upgrades Python syntax to the target version.
  entry: pyupgrade
  language: python
  additional_dependencies: ["pyupgrade==3.21.2"]
  types: [python]
  args: ["--py314-plus"]

- id: isort
  name: isort
  description: Sorts and formats Python imports.
  entry: isort
  language: python
  additional_dependencies: ["isort==5.10.1"]
  types: [python]

- id: black
  name: black
  description: Formats Python.
  entry: black
  language: python
  additional_dependencies: ["black==26.3.1"]
  types_or: [python, pyi]

- id: flake8
  name: flake8
  description: Lints Python, including docstrings.
  entry: flake8
  language: python
  additional_dependencies:
    - flake8==7.3.0
    - flake8-docstrings>=1.7
    - pydocstyle>=6.3
  types: [python]

# django-mypy runs the project's own uv-managed venv (a system hook), not an
# isolated environment: mypy's Django plugin initialises Django to introspect
# settings, so every real runtime dependency, not only django-stubs, must be
# importable wherever mypy runs, and the project's venv already has them all.
# It reports errors without blocking a commit until a project's type coverage
# allows it (see pre-commit/pre-commit#923). The strictness comes from
# [tool.mypy] in pyproject.toml, which `update` keeps to settings/python.toml.
- id: django-mypy
  name: mypy
  description: Type-checks a Django API with mypy, through the project's own uv environment.
  entry: >-
    bash -c 'PYTHONPATH=api uv run mypy --follow-imports=silent --config-file=pyproject.toml
    --namespace-packages --explicit-package-bases "$@" || true' --
  language: system
  types: [python]
  verbose: true

- id: check-json
  name: check json
  description: Checks JSON files parse.
  entry: check-json
  language: python
  additional_dependencies: ["pre-commit-hooks==6.0.0"]
  types: [json]

- id: yamllint
  name: yamllint
  description: Lints YAML, strictly.
  entry: yamllint
  language: python
  additional_dependencies: ["yamllint==1.37.1"]
  types: [file, yaml]
  args: ["--strict"]

- id: shellcheck
  name: shellcheck
  description: Lints shell scripts.
  entry: shellcheck
  language: python
  additional_dependencies: ["shellcheck-py==0.10.0.1"]
  types: [shell]
  require_serial: true

# taplo-lint validates against no schema: taplo 0.9.3 can't decode the
# remote schemastore.org catalog its default fetches, so that fetch would
# fail every run touching a TOML file. Formatting is checked in full.
- id: taplo-format
  name: taplo format
  description: Formats TOML.
  entry: taplo format
  language: python
  additional_dependencies: ["taplo==0.9.3"]
  types: [toml]

- id: taplo-lint
  name: taplo lint
  description: Lints TOML.
  entry: taplo lint
  language: python
  additional_dependencies: ["taplo==0.9.3"]
  types: [toml]
  args: ["--no-schema"]

- id: checkmake
  name: checkmake
  description: Lints Makefiles.
  entry: checkmake
  language: golang
  additional_dependencies: ["github.com/checkmake/checkmake/cmd/checkmake@v0.3.2"]
  types: [makefile]

# The Flutter hooks every product's web app shares. They run the app's own
# Flutter, through fvm when it's installed, so they're system hooks. The git
# variables pre-commit sets are unset first, because Flutter's own git calls
# would otherwise read the hook's index.
- id: dart-format
  name: dart format
  description: Formats Dart, through fvm when it's installed.
  entry: >-
    env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE -u GIT_PREFIX
    bash -c 'if command -v fvm >/dev/null 2>&1; then fvm dart format "$@"; else dart format "$@"; fi' --
  language: system
  types: [dart]

- id: flutter-analyze
  name: flutter analyze
  description: Analyses the Flutter app, failing on infos too.
  entry: >-
    env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE -u GIT_PREFIX
    bash -c 'if command -v fvm >/dev/null 2>&1; then fvm flutter analyze --fatal-infos;
    else flutter analyze --fatal-infos; fi'
  language: system
  types: [dart]
  pass_filenames: false
