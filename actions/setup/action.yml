name: Set up
description: >-
  The CI setup every ProductForge repository repeats, written once: uv with the
  Python this release states and its cache, the pre-commit cache keyed on the
  caller's hook files, and make install, with Flutter as an option. Run this
  after actions/checkout; a repository's own parallel checks follow it.

inputs:
  flutter:
    description: >-
      Set up Flutter from the caller's own .fvmrc before installing.
    required: false
    default: "false"
  token:
    description: >-
      The read token for the workspace's private shared projects (the organisation secret
      PF_READ_TOKEN). Given, every Git read of the repository owner's repositories for the rest of the
      job authenticates with it, held only in the job's environment and masked in the log. Empty,
      nothing changes.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # A caller that gives no token reads this repository anonymously, so a private one is named here, at the
    # first step that needs it, and not by a Git error deep in an install. A local `./actions/setup` has no
    # repository of its own to look up: its caller's workflow made this check before it checked the action out.
    - name: Check this repository can be read
      if: inputs.token == '' && github.action_repository != ''
      shell: bash
      env:
        ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        if ! GIT_TERMINAL_PROMPT=0 git ls-remote "https://github.com/${ACTION_REPOSITORY}" HEAD > /dev/null 2>&1; then
          echo "::error::${ACTION_REPOSITORY} can't be read without a token:" \
            "give this action's token input the organisation secret PF_READ_TOKEN."
          exit 1
        fi

    # Held in the job's environment as Git configuration, never in a file: no .gitconfig and no checkout's
    # .git/config ever holds the token, and the job's end discards it wherever the job ran.
    - name: Authenticate Git reads with the token
      if: inputs.token != ''
      shell: bash
      env:
        PF_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/git_credential.sh"

    # The Python this release of productforge-config states in settings/python.toml, read from the
    # action's own checkout, so a release moves every repository's Python by moving one value.
    - name: Read the Python version
      id: python
      shell: bash
      run: |
        python3 - "$GITHUB_ACTION_PATH/../../settings/python.toml" >> "$GITHUB_OUTPUT" <<'PY'
        import sys, tomllib
        print("version=" + tomllib.load(open(sys.argv[1], "rb"))["python"]["version"])
        PY

    # A runner image can carry Flutter itself (the self-hosted runner's, on Linux arm64, where flutter-action finds no
    # SDK); when the `flutter` on PATH already reports the version .fvmrc pins, nothing is downloaded. Anything else,
    # including every GitHub-hosted runner, sets Flutter up as before.
    - name: Look for the pinned Flutter on PATH
      id: flutter
      if: inputs.flutter == 'true'
      shell: bash
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'PY'
        import json, subprocess
        try:
            wanted = json.load(open(".fvmrc"))["flutter"]
        except (OSError, ValueError, KeyError):
            print("preinstalled=false")
            raise SystemExit
        try:
            command = ["flutter", "--version", "--machine"]
            text = subprocess.run(command, capture_output=True, text=True, check=True).stdout
            found = json.loads(text[text.index("{"):])["frameworkVersion"]
        except (OSError, subprocess.CalledProcessError, ValueError, KeyError):
            found = None
        print("preinstalled=" + str(found == wanted).lower())
        PY

    - name: Set up Flutter
      if: inputs.flutter == 'true' && steps.flutter.outputs.preinstalled != 'true'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: .fvmrc
        cache: true

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ steps.python.outputs.version }}
        enable-cache: true
        prune-cache: true

    - name: Cache pre-commit environments
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: >-
          pre-commit-${{ hashFiles('.productforge/pre-commit.yaml',
          '.pre-commit-config.yaml', '.pre-commit-lint.yaml') }}

    - name: Install dependencies
      shell: bash
      run: make install
