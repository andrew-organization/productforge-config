name: Set up
description: >-
  The CI setup every ProductForge repository repeats: uv with Python 3.14
  and its cache, the pre-commit cache keyed on the caller's own hook files,
  and make install — with Flutter and Postgres as options. Run this after
  actions/checkout; a repository's own parallel checks follow it.

inputs:
  flutter:
    description: >-
      Set up Flutter from the caller's own .fvmrc before installing.
    required: false
    default: "false"
  postgres:
    description: >-
      Start postgres:18-alpine as a background container before installing,
      for a repository whose own checks wait on it.
    required: false
    default: "false"
  postgres-db:
    description: >-
      The database postgres:18-alpine creates. Required when postgres is
      "true" — there's no shared default, since every repository names its
      own database differently.
    required: false
    default: ""
  postgres-user:
    description: >-
      The role postgres:18-alpine creates, when postgres is "true".
    required: false
    default: "dev"
  postgres-password:
    description: >-
      The password for postgres-user, when postgres is "true".
    required: false
    default: "dev"

runs:
  using: composite
  steps:
    - name: Validate postgres-db
      if: inputs.postgres == 'true'
      shell: bash
      run: |
        if [ -z "${{ inputs.postgres-db }}" ]; then
          echo "::error::postgres: \"true\" requires postgres-db (the database postgres:18-alpine creates)" \
            "— pass it explicitly, e.g. postgres-db: my_app_db" >&2
          exit 1
        fi

    # `docker run -d` itself detaches, so this step returns immediately and
    # the database boots while everything else installs; only a
    # repository's own integration tests wait for it. A composite action's
    # own steps don't support the job-level `background:` key the four
    # repositories' ci.yml files use for this same command — `-d` already
    # gives the same effect. postgres-user/postgres-password default to
    # today's values, shared across every repository; postgres-db has no
    # shared default and is validated above, since a repository's database
    # name is its own to choose.
    - name: Start Postgres
      if: inputs.postgres == 'true'
      shell: bash
      run: >-
        docker run -d --name postgres -p 5432:5432
        -e POSTGRES_DB=${{ inputs.postgres-db }}
        -e POSTGRES_USER=${{ inputs.postgres-user }}
        -e POSTGRES_PASSWORD=${{ inputs.postgres-password }}
        postgres:18-alpine

    - name: Set up Flutter
      if: inputs.flutter == 'true'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version-file: .fvmrc
        cache: true

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.14"
        enable-cache: true
        prune-cache: true

    - name: Cache pre-commit environments
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-lint.yaml') }}

    - name: Install dependencies
      shell: bash
      run: make install
